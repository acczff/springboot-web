server {
    listen 80;
    server_name _;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router 的 history 模式：所有找不到的路径都返回 index.html，让前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理：把 /api/ 开头的请求转发给后端容器
    location /api/ {
        proxy_pass http://app:8080;        # app 是 docker-compose 里后端服务的名字
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
